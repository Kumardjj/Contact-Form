<!DOCTYPE html>
<html>
<head>
    <title>FreeForms Test</title>
</head>

<body>

<h1>Contact Us</h1>

<form
    action="http://127.0.0.1:8000/forms/5786246a-03fa-43b5-9f14-f700d3ab821e/submit"
    method="POST"
>

    <label>Name</label>
    <input type="text" name="name" required>

    <br><br>

    <label>Email</label>
    <input type="email" name="email" required>

    <br><br>

    <label>Subject</label>
    <input type="text" name="subject" required>

    <br><br>

    <label>Message</label>
    <textarea name="message" required></textarea>

    <br><br>

    <button type="submit">Send Message</button>

</form>

</body>
</html>
